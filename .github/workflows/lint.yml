name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  privacy-audit:
    name: Privacy audit (source tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No --git/--zip: this pass is author/build-output independent, so it
      # runs the same for every contributor's branch. The full --git history
      # audit is owner-specific (it asserts every commit is authored by
      # CowboyBingus's noreply address) and stays a maintainer-run check -
      # see docs in this PR for why.
      - name: Scan allowlisted source files for leaked personal data
        # privacy_audit.py treats the *current machine's username* as a secret
        # and flags any file containing that word. On GitHub runners the user
        # is "runner", which legitimately appears in test text ("test runner"),
        # so the audit false-positives in CI. There is no personal identity on
        # a CI runner to protect, so give it a neutral one; every other check
        # (emails, paths, tokens, IPs) still runs unchanged.
        env:
          LOGNAME: ci
          USER: ci
          USERNAME: ci
          COMPUTERNAME: ""
        run: python3 scripts/privacy_audit.py

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff
        run: uvx ruff check .

  lua-syntax:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit + luacheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y luajit luarocks
          sudo luarocks install luacheck
      - name: Parse every .lua file (catches syntax errors; no FFI/Windows needed)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            luajit -e "local f, err = loadfile('$file'); if not f then print('$file: ' .. err); os.exit(1) end" || status=1
          done < <(find . -name '*.lua' -print0)
          exit $status
      - name: luacheck
        # Exit code convention: 0 = clean, 1 = warnings only, 2+ = actual
        # syntax/processing errors. The existing test suite has a long tail
        # of pre-existing style warnings (unused locals, overwritten-before-
        # use, etc.) that aren't worth gating PRs on one ignore-code at a
        # time; only fail the build on 2+ so real errors still block merges
        # while legacy warning noise stays visible but non-blocking.
        run: |
          set +e
          luacheck . --config .luacheckrc
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then exit 1; fi
          exit 0

  identity-and-branding:
    name: Identity is not tied to the name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branding is display-only (identity is pinned and never derived from the name)
        run: python3 tests/test_branding.py -v
      - name: Branding is applied everywhere it should be
        run: python3 .github/scripts/rebrand.py --check

  components-reproduce:
    name: Components reproduce upstream's pinned resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned LuaJIT commit
        id: pin
        run: echo "commit=$(python3 -c "import json;print(json.load(open('dependencies.json'))['dependencies'][0]['commit'])")" >> "$GITHUB_OUTPUT"
      - name: Cache LuaJIT (non-GC64)
        id: cache
        uses: actions/cache@v4
        with:
          path: tools/luajit-src
          key: luajit-linux-nogc64-${{ steps.pin.outputs.commit }}
      - name: Build the pinned LuaJIT, non-GC64 (same bytecode as msvcbuild.bat nogc64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git tools/luajit-src
          git -C tools/luajit-src checkout ${{ steps.pin.outputs.commit }}
          make -C tools/luajit-src -j"$(nproc)" XCFLAGS=-DLUAJIT_DISABLE_GC64
      - name: Compile all components and compare with the pinned hashes
        env:
          HD2_LUAJIT: ${{ github.workspace }}/tools/luajit-src/src/luajit
        run: python3 .github/scripts/verify_components.py

  json-validity:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned/manifest JSON files
        run: |
          set -e
          for f in components.lock.json dependencies.json publication-files.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('$f: ok')"
          done
          find components -name '*.json' -print0 | xargs -0 -n1 -I{} python3 -c "import json,sys; json.load(open('{}')); print('{}: ok')"

  # Note: no EditorConfig-conformance job. .editorconfig specifies 4-space
  # indent, but a chunk of the existing Lua tests use a different width, and
  # components/**/src/* is byte-hash-pinned by components.lock.json - an
  # auto-reformat there would break the build's own "matches original release
  # byte for byte" checks. Not worth gating PRs on pre-existing formatting
  # debt in files that can't safely be reformatted anyway; see the proposal
  # doc for the full reasoning.
